# Free Models for OSagnent (24/7 operation)
free_models:
  - name: qwen-3-6b-plus
    provider: groq
    context_window: 1000000  # 1M tokens!
    cost: free
    use_case: general purpose, research, writing
  
  - name: owlalpha
    provider: openrouter
